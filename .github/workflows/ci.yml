name: CI

# Runs the project's verification suite on every push (any branch, so teammates'
# branches are checked too) and on every pull request into main.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify prototype, evals and sync script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The eval CSVs contain non-ASCII characters (em dashes); force UTF-8 reads.
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: S3 checks — eval set, HTML, document links, app tests
        run: python scripts/verify_s3.py

      - name: S4 checks — rerun deterministic evaluation and safety invariants
        run: python scripts/verify_s4.py

      - name: Committed eval results are reproducible
        # verify_s4.py regenerates evals/results*.json. If the committed files differ,
        # someone changed the engine or fixtures without re-running the eval.
        run: |
          if ! git diff --exit-code -- evals/; then
            echo "::error::evals/results*.json are out of date. Run 'python scripts/verify_s4.py' and commit the regenerated files."
            exit 1
          fi

      - name: Eval-set v1 structure (200 held-out inputs, no overlap with v0)
        run: python scripts/verify_eval_v1.py

      - name: Labeller page tests
        run: node --test scripts/test_labeller.cjs

      - name: Deployment sync script tests (local temp repos, no network)
        run: python scripts/test_sync_deploy.py
